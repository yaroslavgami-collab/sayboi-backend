<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SAY BOI | Courses</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

html{
height:100%;
overflow-y:auto;
}

body{

background:#080808;
color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:40px 20px;

overflow-y:auto;

}

.flag{

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:900px;

opacity:.05;

pointer-events:none;

z-index:0;

}

.overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

backdrop-filter:blur(3px);

}

.container{

position:relative;

z-index:2;

width:100%;
max-width:450px;

}

h1{

text-align:center;

font-size:36px;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#8f8f8f;

margin-bottom:35px;

}

.course{

background:#171717;

border:1px solid #2d2d2d;

border-radius:22px;

padding:24px;

margin-bottom:22px;

transition:.3s;

}

.course:hover{

transform:translateY(-3px);

}

.name{

font-size:24px;

font-weight:700;

margin-bottom:8px;

}

.desc{

color:#9f9f9f;

margin-bottom:15px;

}

.price{

font-size:32px;

font-weight:700;

margin-bottom:18px;

}

button{

width:100%;

height:58px;

border:none;

border-radius:16px;

font-size:18px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.buy{

background:white;

color:black;

}

.buy:hover{

background:#dedede;

}

.disabled{

background:#262626;

color:#777;

cursor:not-allowed;

}

.back{

margin-top:12px;

background:transparent;

border:1px solid #2e2e2e;

color:white;

}

</style>

</head>

<body>

<div class="overlay"></div>

<img
class="flag"
src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg">

<div class="container">

<h1>Courses</h1>

<p class="subtitle">

Choose your English course

</p>

<div class="course">

<div class="name">

👑 English Premium

</div>

<div class="desc">

Full access to all lessons

</div>

<div class="price">

1500 грн

</div>

<button
class="buy"
onclick="location.href='payment.html?course=premium'">

BUY NOW

</button>

</div>

<div class="course">

<div class="name">

🚀 English Plus

</div>

<div class="desc">

Coming Soon

</div>

<div class="price">

—

</div>

<button class="disabled">

COMING SOON

</button>

</div>

<div class="course">

<div class="name">

📚 English Starter

</div>

<div class="desc">

Coming Soon

</div>

<div class="price">

—

</div>

<button class="disabled">

COMING SOON

</button>

</div>

<button
class="back"
onclick="history.back()">

← Back

</button>

</div>

<script>

Telegram.WebApp.ready();

Telegram.WebApp.expand();

</script>

</body>

</html>
