{% extends "base.html" %}
{% block title %}Вхід — SAY BOI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="brand-mark-lg"></div>
    <h1 class="auth-title">SAY BOI</h1>
    <p class="auth-subtitle">Платформа для навчання</p>

    <div class="card auth-card">
      <span class="badge">🔐 Особистий кабінет</span>

      <form method="post">
        <label for="login">Логін</label>
        <input type="text" id="login" name="login" required autofocus autocomplete="username">

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button class="btn btn-full" type="submit">Увійти</button>
      </form>
    </div>

    <p class="auth-footnote">🔒 Учень або вчитель — логін і пароль надійшли вам у Telegram</p>
  </div>
</div>
{% endblock %}
