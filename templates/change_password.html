{% extends "base.html" %}
{% block title %}Зміна пароля{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 40px auto;">
  <h2>Встановіть новий пароль</h2>
  {% if account.must_change_password %}
    <p class="muted">Це ваш перший вхід — потрібно задати власний пароль.</p>
  {% endif %}
  <form method="post">
    <label for="password">Новий пароль</label>
    <input type="password" id="password" name="password" minlength="6" required>

    <label for="confirm">Повторіть пароль</label>
    <input type="password" id="confirm" name="confirm" minlength="6" required>

    <button class="btn" type="submit">Зберегти</button>
  </form>
</div>
{% endblock %}
