{% extends "base.html" %}
{% block title %}Зміна пароля — SAY BOI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="brand-mark-lg"></div>
    <h1 class="auth-title">Новий пароль</h1>
    <p class="auth-subtitle">
      {% if account.must_change_password %}
        Це ваш перший вхід — задайте власний пароль
      {% else %}
        Встановіть новий пароль для входу
      {% endif %}
    </p>

    <div class="card auth-card">
      <form method="post">
        <label for="password">Новий пароль</label>
        <input type="password" id="password" name="password" minlength="6" required autofocus autocomplete="new-password">

        <label for="confirm">Повторіть пароль</label>
        <input type="password" id="confirm" name="confirm" minlength="6" required autocomplete="new-password">

        <button class="btn btn-full" type="submit">Зберегти</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
